name: Deploy egui App to GitHub Pages

on:
  push:
    branches:
      - main # Triggers compilation whenever you push to main

permissions:
  contents: write # Required to allow the runner to push to the gh-pages branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          # Optional: Specify a version, or leave it blank to get the latest
          version: 'latest' 

      - name: Build Web Application
        # GitHub Pages serves your site at NeuroSumbaD.github.io/izhikevich-gui/
        run: trunk build --release --public-url "/izhikevich-gui/"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # This tells the runner to deploy the compiled outputs from Trunk
          branch: gh-pages # Target branch for hosting
